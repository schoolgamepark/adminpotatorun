<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오시후의 감자 달리기_버전2 (마스터 에디션)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            width: 80%;
            z-index: 5;
        }
        #stage-info {
            font-size: 32px;
            color: #ff3333;
            margin-bottom: 5px;
            animation: blink 1s infinite alternate;
        }
        #juwan-dis {
            font-size: 26px;
            color: #ffcc00;
            margin-top: 5px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff0000;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 0.6; } to { opacity: 1; }
        }
        #skill-ui {
            margin-top: 10px;
            font-size: 18px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .skill { padding: 5px 10px; border-radius: 5px; background: rgba(0,0,0,0.5); }
        .ready { color: #33ff33; border: 1px solid #33ff33; }
        .cooldown { color: #ff3333; border: 1px solid #ff3333; opacity: 0.6; }

        #jump-warning {
            display: none;
            margin-top: 15px;
            font-size: 28px;
            color: #ffcc00;
            text-shadow: 0 0 10px #ff0000;
            animation: blink 0.3s infinite alternate;
        }

        /* 플레이어 정보 표시 (좌측 상단) */
        #player-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #00ffff;
            z-index: 10;
        }

        /* 우측 전광판 2단 분리 레이아웃 */
        .board-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        .info-board {
            width: 320px;
            height: 160px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
        }
        #server-board { border: 2px solid #ffcc00; }
        #user-board { border: 2px solid #00ffff; }
        
        .msg-title {
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            font-size: 14px;
        }

        .msg-item {
            margin-bottom: 6px;
            word-break: break-all;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .msg-admin { color: #ff3333; font-weight: bold; }
        .msg-server { color: #33ff33; font-weight: bold; }
        .msg-friend { color: #cc66ff; font-weight: bold; } 
        .msg-user { color: #00ffff; }

        /* 일반 채팅 입력 모달 */
        #chat-modal {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            border: 2px solid #00ffff;
            padding: 20px;
            border-radius: 10px;
            z-index: 20;
            text-align: center;
        }
        #chat-input {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            background: #222;
            color: white;
            border: 1px solid #00ffff;
            border-radius: 5px;
            outline: none;
        }

        #msg-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .over { color: #ff0000; }
        .clear { color: #33ff33; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="player-info">접속 중: 로딩 중...</div>

    <div id="ui">
        <div id="stage-info">STAGE 1</div>
        <div id="juwan-dis">🔥 오시후의 감자 달리기_버전2 🔥</div>
        <div id="score">Score: 0 / 20</div>
        <div id="skill-ui">
            <div id="skill-q" class="skill ready">[Q] 슈퍼 점프 : READY</div>
            <div id="skill-e" class="skill ready">[E] 초고속 대시 : READY</div>
        </div>
        <div id="jump-warning">슈퍼점프를 준비하세요!🔥</div>
        <div style="font-size:14px; color:#aaa; margin-top:5px;">조작: A / D | 점프: Space | <b>[/] 키: 전체 유저 채팅 입력</b></div>
    </div>

    <div class="board-container">
        <div id="server-board" class="info-board">
            <div class="msg-title" style="color: #ffcc00;">🌐 방장 · 서버 메시지</div>
            <div id="server-chat-content"></div>
        </div>
        <div id="user-board" class="info-board">
            <div class="msg-title" style="color: #00ffff;">💬 플레이어 메시지</div>
            <div id="user-chat-content"></div>
        </div>
    </div>

    <div id="chat-modal">
        <div style="color:#00ffff; font-weight:bold; margin-bottom:10px;">💬 전체 유저 채팅 입력</div>
        <input type="text" id="chat-input" placeholder="메시지를 입력하고 엔터를 누르세요..." maxlength="50">
    </div>
   
    <div id="msg-screen">
        <span id="msg-text"></span><br>
        <span style="font-size:20px; color:white;">스페이스바를 눌러 다시 시작</span>
    </div>

<script>
// --- [관리자 및 유저 닉네임 시스템] ---
const ADMIN_PASSWORD = "0000";
const CREATOR_PANEL_CODE = "1018"; 

// [업데이트] 접속 시 IP 연동을 완전히 빼고, 즉시 랜덤 감자 이름 부여
let myUsername = "감자_" + Math.floor(1000 + Math.random() * 9000);
let isFriendCreator = false;

// 내 닉네임을 수동으로 바꾸고 싶다면 바꿀 수 있도록 유연하게 창을 띄워줄 수도 있습니다.
let customName = prompt(`당신의 닉네임을 설정하세요 (기본값: ${myUsername})`);
if(customName && customName.trim() !== "") {
    myUsername = customName.trim();
}

document.getElementById('player-info').innerText = `접속 중: [${myUsername}]`;

// --- [Firebase 실시간 서버 연동] ---
const firebaseConfig = {
    apiKey: "AIzaSyBhovWexS2BwgQBr93isLEa_oZEJBgV0U0",
    authDomain: "potato-974df.firebaseapp.com",
    databaseURL: "https://potato-974df-default-rtdb.firebaseio.com",
    projectId: "potato-974df",
    storageBucket: "potato-974df.firebasestorage.app",
    messagingSenderId: "398332527462",
    appId: "1:398332527462:web:966327f8a76198062b3ea7",
    measurementId: "G-HKWLH5FHQ0"
};

let database = null;
try {
    firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    
    // [업데이트] 내 닉네임이 서버 실시간 '제작자 친구 닉네임 목록'에 있는지 체크
    database.ref('creator_friends_names').child(myUsername).once('value', (snapshot) => {
        if(snapshot.exists() && snapshot.val() === true) {
            isFriendCreator = true;
        }
    });

    initFirebaseListeners();
} catch(e) {
    console.error("Firebase 연결 실패:", e);
}

function initFirebaseListeners() {
    if(!database) return;
    database.ref('global_messages').on('child_added', (snapshot) => {
        const data = snapshot.val();
        addMessageToBoard(data.type, data.sender, data.text);
    });

    // 만약 실시간으로 누군가 나를 추가해줬을 때 즉시 반영되도록 감시
    database.ref('creator_friends_names').child(myUsername).on('value', (snapshot) => {
        if(snapshot.exists() && snapshot.val() === true) {
            isFriendCreator = true;
        }
    });
}

function addMessageToBoard(type, sender, text) {
    const serverContent = document.getElementById('server-chat-content');
    const userContent = document.getElementById('user-chat-content');
    let prefix = "";
    
    if (type === 'admin') {
        prefix = `<span class="msg-admin">[무다방장]</span>`;
        serverContent.innerHTML += `<div class="msg-item">${prefix}: ${text}</div>`;
        document.getElementById('server-board').scrollTop = document.getElementById('server-board').scrollHeight;
    } else if (type === 'server') {
        prefix = `<span class="msg-server">[Server]</span>`;
        serverContent.innerHTML += `<div class="msg-item">${prefix}: ${text}</div>`;
        document.getElementById('server-board').scrollTop = document.getElementById('server-board').scrollHeight;
    } else if (type === 'friend') {
        prefix = `<span class="msg-friend">[제작자 친구]</span>`;
        userContent.innerHTML += `<div class="msg-item">${prefix}: ${text}</div>`;
        document.getElementById('user-board').scrollTop = document.getElementById('user-board').scrollHeight;
    } else {
        prefix = `<span class="msg-user">[${sender}]</span>`;
        userContent.innerHTML += `<div class="msg-item">${prefix}: ${text}</div>`;
        document.getElementById('user-board').scrollTop = document.getElementById('user-board').scrollHeight;
    }
}

function sendPush(type, sender, text) {
    if(!text || text.trim() === "") return;
    
    // 메시지 보낼 때 내가 제작자 친구라면 타입을 'friend'로 강제 치환
    if(type === 'user' && isFriendCreator) {
        type = 'friend';
    }
    
    if(database) {
        database.ref('global_messages').push({
            type: type,
            sender: sender,
            text: text,
            timestamp: Date.now()
        });
    } else {
        addMessageToBoard(type, sender, text + " (서버 미연동)");
    }
}

// 3분 정기 홍보봇 타이머
setInterval(() => {
    if(!gameOver) {
        addMessageToBoard('server', 'System', '이 게임이 재밌으시다면, 많이 홍보해 주세요:)');
    }
}, 180000);


// --- [게임 핵심 로직] ---
let scene, camera, renderer;
let potato, ground;
let obstacles = [];
let bunkers = [];
let score = 0;
let currentStage = 1;
let gameOver = false;
let gameClear = false;
let isChatting = false;

const stageTargets = {
    1: 20, 2: 20, 3: 25, 4: 25, 5: 30,
    6: 30, 7: 35, 8: 35, 9: 40, 10: 50
};

let groundY = 0;
let potatoVY = 0;
const gravity = -0.026; 
const jumpForce = 0.52;  
const superJumpForce = 0.85;

let isGrounded = true;
let spawnTimer = 0;
let poopSpawnTimer = 0;
let bunkerSpawnTimer = 0;

let moveLeft = false;
let moveRight = false;
let canSuperJump = true;
let canDash = true;
let isDashing = false;
let dashTimer = 0;
const dashDuration = 15;

let bigBunkerSpawned = false;
let isWarningVisible = false;

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a0005);
    scene.fog = new THREE.FogExp2(0x1a0005, 0.025);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 8);
    camera.lookAt(0, 1.5, -10);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 20, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const groundGeo = new THREE.BoxGeometry(10, 2, 200);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x220505 });
    ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.set(0, groundY - 1, -80);
    ground.receiveShadow = true;
    scene.add(ground);

    const potatoGeo = new THREE.SphereGeometry(0.6, 32, 32);
    potatoGeo.scale(1.2, 0.9, 1);
    const potatoMat = new THREE.MeshLambertMaterial({ color: 0xCD853F });
    potato = new THREE.Mesh(potatoGeo, potatoMat);
    potato.position.set(0, 0.6, 0);
    potato.castShadow = true;
    scene.add(potato);

    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('resize', onWindowResize);

    document.getElementById('chat-input').addEventListener('keydown', function(e) {
        if(e.key === 'Enter') {
            const txt = this.value;
            if(txt.trim() !== "") {
                sendPush('user', myUsername, txt);
            }
            this.value = "";
            document.getElementById('chat-modal').style.display = "none";
            isChatting = false;
        }
    });

    animate();
}

function onKeyDown(e) {
    if (isChatting) return;

    if (e.key === '/') {
        e.preventDefault();
        isChatting = true;
        document.getElementById('chat-modal').style.display = "block";
        document.getElementById('chat-input').focus();
        return;
    }

    if (e.key === '1') {
        const isMaster = localStorage.getItem('isPotatoMaster') === 'true';
        if (!isMaster) {
            alert("🔒 권한이 없습니다! [2]번 키를 눌러 비밀번호 인증을 먼저 진행해 주세요.");
            return;
        }
        let textInput = prompt("[무다방장] 공지 메시지를 작성하세요:");
        if (textInput !== null && textInput.trim() !== "") {
            sendPush('admin', '방장', textInput);
        }
        return;
    }

    if (e.key === '2') {
        let pw = prompt("방장 인증 비밀번호를 입력하세요:");
        if (pw === ADMIN_PASSWORD) {
            localStorage.setItem('isPotatoMaster', 'true');
            alert("👑 [무다방장] 권한 인증 완료! 이제 1번 키로 특별 공지를 송출할 수 있습니다.");
        } else if (pw !== null) {
            alert("❌ 패스워드가 올바르지 않습니다.");
        }
        return;
    }

    // [업데이트] 닉네임 기반으로 제작자 친구를 등록하도록 수정
    if (e.key === '3') {
        let code = prompt("제작자 패널 보안 코드를 입력하세요:");
        if(code === CREATOR_PANEL_CODE) {
            let targetName = prompt("추가할 제작자 친구의 '닉네임'을 정확하게 입력하세요:\n(예: 감자_1234 또는 설정한 커스텀 닉네임)");
            if(targetName && targetName.trim() !== "" && database) {
                let cleanName = targetName.trim();
                // 닉네임 그대로 데이터베이스 노드에 true로 설정
                database.ref('creator_friends_names').child(cleanName).set(true);
                alert(`✨ [${cleanName}] 닉네임이 제작자 친구 목록에 실시간 등록되었습니다!`);
            } else if (!database) {
                alert("❌ 실시간 서버와 연동되지 않은 상태입니다.");
            }
        } else if(code !== null) {
            alert("❌ 패널 보안 코드가 일치하지 않습니다!");
        }
        return;
    }

    if (gameOver || gameClear) {
        if (e.code === 'Space') resetGame();
        return;
    }

    if (e.code === 'KeyA') moveLeft = true;
    if (e.code === 'KeyD') moveRight = true;
    
    if (e.code === 'Space' && isGrounded) {
        potatoVY = jumpForce;
        isGrounded = false;
    }

    if (e.code === 'KeyQ' && canSuperJump && isGrounded) {
        potatoVY = superJumpForce;
        isGrounded = false;
        canSuperJump = false;
        updateSkillUI('skill-q', false, '[Q] 슈퍼 점프 : COOLDOWN');
        setTimeout(() => {
            canSuperJump = true;
            updateSkillUI('skill-q', true, '[Q] 슈퍼 점프 : READY');
        }, 3000);
    }

    if (e.code === 'KeyE' && canDash && !isDashing) {
        isDashing = true;
        canDash = false;
        dashTimer = dashDuration;
        updateSkillUI('skill-e', false, '[E] 초고속 대시 : USING');
        setTimeout(() => {
            canDash = true;
            updateSkillUI('skill-e', true, '[E] 초고속 대시 : READY');
        }, 2000);
    }
}

function onKeyUp(e) {
    if (e.code === 'KeyA') moveLeft = false;
    if (e.code === 'KeyD') moveRight = false;
}

function updateSkillUI(id, ready, text) {
    const el = document.getElementById(id);
    if(el) {
        el.className = ready ? 'skill ready' : 'skill cooldown';
        el.innerText = text;
    }
}

function spawnWall() {
    const targetScore = stageTargets[currentStage] || 50;
    if (score >= targetScore) return;

    let width = Math.random() * 2 + 1.5; 
    let height = Math.random() * 1.0 + 1.5; 
    let depth = 1.0; 
    let geo = new THREE.BoxGeometry(width, height, depth);
    let mat = new THREE.MeshLambertMaterial({ color: 0x888888 }); 
    let mesh = new THREE.Mesh(geo, mat);
    
    mesh.position.set(Math.random() * (8 - width) - (4 - width/2), height / 2, -100);
    mesh.userData = { type: 'wall', passed: false };
    mesh.castShadow = true;
    scene.add(mesh);
    obstacles.push(mesh);
}

function showJumpWarning() {
    if (!isWarningVisible) {
        document.getElementById('jump-warning').style.display = "block";
        isWarningVisible = true;
    }
}

function hideJumpWarning() {
    if (isWarningVisible) {
        document.getElementById('jump-warning').style.display = "none";
        isWarningVisible = false;
    }
}

function spawnBunker(isBig = false) {
    let width = isBig ? 10 : (Math.random() * 2 + 1.5);
    let height = isBig ? 3.0 : 0.8;
    let depth = isBig ? 15 : 3;
    let geo = new THREE.BoxGeometry(width, height, depth);
    let mat = new THREE.MeshLambertMaterial({ color: isBig ? 0x8b0000 : 0x3a3a3a });
    let mesh = new THREE.Mesh(geo, mat);

    mesh.position.set(isBig ? 0 : (Math.random() * 7 - 3.5), height / 2, -120);
    mesh.userData = { isBig: isBig, height: height };
    mesh.receiveShadow = true;
    scene.add(mesh);
    bunkers.push(mesh);
}

function spawnPoop() {
    let geo = new THREE.SphereGeometry(0.5, 8, 8);
    let mat = new THREE.MeshLambertMaterial({ color: 0x4a2e1b });
    let mesh = new THREE.Mesh(geo, mat);
    
    mesh.position.set(Math.random() * 8 - 4, 12, -40 - Math.random() * 50);
    mesh.userData = { type: 'poop', speedY: Math.random() * 0.2 + 0.2 };
    scene.add(mesh);
    obstacles.push(mesh);
}

function checkCollision(mesh) {
    let box1 = new THREE.Box3().setFromObject(potato);
    let box2 = new THREE.Box3().setFromObject(mesh);
    return box1.intersectsBox(box2);
}

function animate() {
    if (gameOver || gameClear) return;
    requestAnimationFrame(animate);

    let baseSpeed = 0.65 + (currentStage * 0.05);
    if (currentStage >= 3) {
        baseSpeed += 0.25; 
    }

    if (isDashing) {
        baseSpeed *= 1.8;
        dashTimer--;
        if (dashTimer <= 0) {
            isDashing = false;
            updateSkillUI('skill-e', false, '[E] 초고속 대시 : COOLDOWN');
        }
    }

    let sideSpeed = currentStage >= 3 ? 0.35 : 0.25;
    if (moveLeft && potato.position.x > -4.3) potato.position.x -= sideSpeed;
    if (moveRight && potato.position.x < 4.3) potato.position.x += sideSpeed;

    potato.position.y += potatoVY;
    
    let currentGroundLevel = 0.6; 
    let onBunker = false;
    let warningActive = false;

    for (let bunker of bunkers) {
        let bW = bunker.userData.isBig ? 5 : 1.2;
        let bD = bunker.userData.isBig ? 8 : 2;
        
        if (bunker.userData.isBig && potato.position.z >= bunker.position.z - (bD + 20) && potato.position.z <= bunker.position.z + bD) {
            warningActive = true;
        }

        if (potato.position.x >= bunker.position.x - bW && potato.position.x <= bunker.position.x + bW &&
            potato.position.z >= bunker.position.z - bD && potato.position.z <= bunker.position.z + bD) {
            if (potato.position.y >= (bunker.userData.height - 0.2) && potatoVY <= 0) {
                currentGroundLevel = bunker.userData.height + 0.6; 
                onBunker = true;
            }
        }
    }

    if (warningActive) showJumpWarning();
    else hideJumpWarning();

    if (!isGrounded || onBunker) {
        potatoVY += gravity;
        if (potato.position.y <= currentGroundLevel) {
            potato.position.y = currentGroundLevel;
            potatoVY = 0;
            isGrounded = true;
        }
    } else {
        if (potato.position.y > 0.6 && !onBunker) {
            isGrounded = false;
        }
    }

    spawnTimer++;
    let spawnRate = Math.max(5, 22 - currentStage * 2);
    if (currentStage === 10) spawnRate = 3; 

    if (spawnTimer > spawnRate) {
        spawnWall();
        spawnTimer = 0;
    }

    bunkerSpawnTimer++;
    if (currentStage === 9 && score >= 30 && !bigBunkerSpawned) {
        spawnBunker(true); 
        bigBunkerSpawned = true;
    } else if (currentStage !== 9 && bunkerSpawnTimer > 40) {
        spawnBunker(false);
        bunkerSpawnTimer = 0;
    }

    if (currentStage >= 4) {
        poopSpawnTimer++;
        if (poopSpawnTimer > Math.max(4, 15 - currentStage)) {
            spawnPoop();
            poopSpawnTimer = 0;
        }
    }

    for (let i = bunkers.length - 1; i >= 0; i--) {
        bunkers[i].position.z += baseSpeed;
        if (bunkers[i].position.z > 15) {
            scene.remove(bunkers[i]);
            bunkers.splice(i, 1);
        }
    }

    const targetScore = stageTargets[currentStage] || 50;
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.position.z += baseSpeed;
        if (obs.userData.type === 'poop') obs.position.y -= obs.userData.speedY;

        if (!obs.userData.passed && obs.position.z > potato.position.z) {
            obs.userData.passed = true;
            score++;
            document.getElementById('score').innerText = `Score: ${score} / ${targetScore}`;

            if (currentStage === 10 && score >= 15) {
                triggerForcedDeath();
                return;
            }
        }

        if (checkCollision(obs)) {
            triggerGameOver();
            return;
        }

        if (obs.position.z > 10 || obs.position.y < -1) {
            scene.remove(obs);
            obstacles.splice(i, 1);
        }
    }

    if (score >= targetScore) {
        if (currentStage < 10) {
            currentStage++;
            score = 0;
            document.getElementById('stage-info').innerText = `STAGE ${currentStage}`;
            document.getElementById('score').innerText = `Score: 0 / ${stageTargets[currentStage]}`;
            if(currentStage === 10) {
                document.getElementById('stage-info').innerText = "STAGE 10 (HELL)";
            }
            clearMap();
        } else {
            triggerGameClear();
            return;
        }
    }

    renderer.render(scene, camera);
}

function clearMap() {
    obstacles.forEach(obs => scene.remove(obs));
    bunkers.forEach(b => scene.remove(b));
    obstacles = [];
    bunkers = [];
}

function triggerGameOver() {
    gameOver = true;
    document.getElementById('msg-text').innerText = "벽에 부딪혔습니다! GAME OVER";
    document.getElementById('msg-screen').className = "over";
    document.getElementById('msg-screen').style.display = "block";
}

function triggerForcedDeath() {
    gameOver = true;
    document.getElementById('msg-text').innerText = "💀 10스테이지의 저주: 15점을 넘겨 시스템이 폭파되었습니다! 💀";
    document.getElementById('msg-screen').className = "over";
    document.getElementById('msg-screen').style.display = "block";
}

function triggerGameClear() {
    gameClear = true;
    sendPush('server', 'System', `[${myUsername}]님이 모든 스테이지를 깨셨습니다!`);
    
    document.getElementById('msg-text').innerText = "신계의 컨트롤러 등장! 지옥 레이싱 클리어!";
    document.getElementById('msg-screen').className = "clear";
    document.getElementById('msg-screen').style.display = "block";
}

function resetGame() {
    gameOver = false;
    gameClear = false;
    score = 0;
    currentStage = 1;
    bigBunkerSpawned = false;
    potato.position.set(0, 0.6, 0);
    potatoVY = 0;
    isGrounded = true;
    isDashing = false;
    isChatting = false;
    document.getElementById('chat-modal').style.display = "none";
    hideJumpWarning(); 
    
    canSuperJump = true;
    canDash = true;
    updateSkillUI('skill-q', true, '[Q] 슈퍼 점프 : READY');
    updateSkillUI('skill-e', true, '[E] 초고속 대시 : READY');

    document.getElementById('stage-info').innerText = `STAGE 1`;
    document.getElementById('score').innerText = `Score: 0 / ${stageTargets[1]}`;
    document.getElementById('msg-screen').style.display = "none";

    clearMap();
    animate();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = init;
</script>
</body>
</html>
